[project]
name = "excel-analysis-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mominabutt24", email = "bmomina752@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "gradio>=6.29.0",
    "langchain>=1.4.3",
    "langchain-cerebras>=0.8.2",
    "langfuse>=4.16.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "prometheus-client>=0.26.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
excel-analysis-agent = "excel_analysis_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
